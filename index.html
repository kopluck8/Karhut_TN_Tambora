<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotspot TN Gunung Tambora</title>
    <!-- CSS Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <!-- JS Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- JS Turf.js -->
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <!-- JS PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100%; height: 100vh; }
        
        .info-panel {
            padding: 12px 16px;
            font: 14px/16px Arial, Helvetica, sans-serif;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
            color: #333;
            min-width: 220px;
        }
        .info-panel h4 { margin: 0 0 8px; color: #111; border-bottom: 2px solid #ccc; padding-bottom: 5px; }
        .info-panel .total { font-size: 16px; font-weight: bold; margin-top: 10px; border-top: 1px solid #ccc; padding-top: 5px; }

        .map-label { background: transparent !important; border: none !important; box-shadow: none !important; font-family: Arial, sans-serif; text-align: center; }
        .map-label::before { display: none; }
        .label-resor { color: #00FF00; font-size: 12px; font-weight: bold; text-shadow: 1px 1px 2px #000, -1px -1px 2px #000; }
        .label-grid { color: #FFFFFF; font-size: 9px; text-shadow: 1px 1px 2px #000, -1px -1px 2px #000; }
        .label-jalur { color: #FF00FF; font-size: 10px; font-weight: bold; text-shadow: 1px 1px 2px #000, -1px -1px 2px #000; }

        /* Gaya Tabel Popup ala Sipongi */
        .sipongi-popup table { width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; font-size: 12px; }
        .sipongi-popup th, .sipongi-popup td { padding: 6px; border-bottom: 1px solid #ddd; text-align: left; }
        .sipongi-popup th { width: 40%; font-weight: bold; color: #333; background: #f9f9f9;}
        .sipongi-popup .leaflet-popup-content-wrapper { border-radius: 4px; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        var map = L.map('map').setView([-8.250189, 118.046122], 10);

        var basemap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        var resorGeoJSON;
        var hotspotLayerGroup = L.layerGroup().addTo(map);
        var gridLayerGroup = L.layerGroup(); 
        var jalurLayerGroup = L.layerGroup().addTo(map);
        var resorLayerGroup = L.layerGroup().addTo(map);

        var stats = { "Resort Doro Ncanga": 0, "Resort Pancasila": 0, "Resort Doropeti": 0, "Resort Kawinda Toi": 0, "Resort Oi Katupa": 0, "Resort Piong": 0, "Total": 0 };

        var infoControl = L.control({position: 'topright'});
        infoControl.onAdd = function (map) { this._div = L.DomUtil.create('div', 'info-panel'); this.update(); return this._div; };
        infoControl.update = function () {
            this._div.innerHTML = '<h4>Sebaran Hotspot per Resor</h4>' +
                'Doro Ncanga: <b>' + stats["Resort Doro Ncanga"] + '</b><br>' +
                'Pancasila: <b>' + stats["Resort Pancasila"] + '</b><br>' +
                'Doropeti: <b>' + stats["Resort Doropeti"] + '</b><br>' +
                'Kawinda Toi: <b>' + stats["Resort Kawinda Toi"] + '</b><br>' +
                'Oi Katupa: <b>' + stats["Resort Oi Katupa"] + '</b><br>' +
                'Piong: <b>' + stats["Resort Piong"] + '</b><br>' +
                '<div class="total">Total Kawasan: ' + stats["Total"] + ' Titik</div>' +
                '<small style="display:block; margin-top:8px;"><i>Data: NASA FIRMS (24 Jam)</i></small>';
        };
        infoControl.addTo(map);

        function getMarkerStyle(confidenceLevel) {
            let color = 'yellow'; 
            if (confidenceLevel === 'h' || confidenceLevel >= 80) color = 'red';
            else if (confidenceLevel === 'n' || (confidenceLevel >= 30 && confidenceLevel < 80)) color = 'orange';
            return { radius: 5, fillColor: color, color: "#000", weight: 1, opacity: 1, fillOpacity: 0.9 };
        }

        // Translasi Level Confidence (Menyelaraskan MODIS & VIIRS ke teks High/Medium/Low)
        function getConfidenceText(conf) {
            if (conf === 'h' || conf >= 80) return 'High';
            if (conf === 'n' || (conf >= 30 && conf < 80)) return 'Medium';
            return 'Low';
        }

        async function loadGeoJSON(url, layerGroup, styleOptions, labelField, cssClass, isResor = false) {
            try {
                const response = await fetch(url);
                const data = await response.json();
                L.geoJSON(data, {
                    style: styleOptions,
                    onEachFeature: function (feature, layer) {
                        if (labelField && feature.properties && feature.properties[labelField]) {
                            layer.bindTooltip(String(feature.properties[labelField]), { permanent: true, direction: 'center', className: 'map-label ' + cssClass });
                        }
                    }
                }).addTo(layerGroup);
                return data;
            } catch (error) { return null; }
        }

        async function initMapData() {
            resorGeoJSON = await loadGeoJSON('resor.geojson', resorLayerGroup, { color: "#00FF00", weight: 2, fillOpacity: 0.1 }, 'NAME', 'label-resor', true);
            await loadGeoJSON('grid.geojson', gridLayerGroup, { color: "#FFFFFF", weight: 1, dashArray: '5, 5', fillOpacity: 0 }, 'Grid_ID', 'label-grid', false);
            await loadGeoJSON('jalur.geojson', jalurLayerGroup, { color: "#FF00FF", weight: 3, opacity: 0.8 }, null, 'label-jalur', false);

            var overlayMaps = { "Batas Resor": resorLayerGroup, "Grid Pengelolaan": gridLayerGroup, "Jalur": jalurLayerGroup, "Titik Hotspot": hotspotLayerGroup };
            L.control.layers({"Basemap": basemap}, overlayMaps, {collapsed: false}).addTo(map);

            const api_key = 'bcd8b7f4bc826aab3b3928e4da79f267'; 
            const bbox = '117.7,-8.4,118.2,-8.1'; 
            const urls = [
                `https://firms.modaps.eosdis.nasa.gov/api/area/csv/${api_key}/MODIS_NRT/${bbox}/1`,
                `https://firms.modaps.eosdis.nasa.gov/api/area/csv/${api_key}/VIIRS_SNPP_NRT/${bbox}/1`,
                `https://firms.modaps.eosdis.nasa.gov/api/area/csv/${api_key}/VIIRS_NOAA20_NRT/${bbox}/1`
            ];

            for (const url of urls) {
                Papa.parse(url, {
                    download: true, header: true, skipEmptyLines: true,
                    complete: function(results) {
                        if(results.data && results.data.length > 0) {
                            results.data.forEach(row => {
                                if(!row.latitude || !row.longitude) return;

                                let lat = parseFloat(row.latitude); let lon = parseFloat(row.longitude);
                                let pt = turf.point([lon, lat]);
                                let isInside = false; let matchedResort = "Luar Kawasan";

                                turf.featureEach(resorGeoJSON, function (currentFeature) {
                                    if(turf.booleanPointInPolygon(pt, currentFeature)) {
                                        isInside = true; matchedResort = currentFeature.properties.NAME;
                                    }
                                });

                                if (isInside) {
                                    if (stats[matchedResort] !== undefined) { stats[matchedResort]++; stats["Total"]++; }

                                    // Merakit Popup Tabel ala Sipongi
                                    let dateStr = row.acq_date + ' ' + row.acq_time + ' UTC';
                                    let satStr = row.satellite ? (row.satellite === 'N' ? 'NASA-SNPP' : (row.satellite === '1' ? 'NASA-NOAA20' : 'NASA-TERRA/AQUA')) : 'Satelit';
                                    let confText = getConfidenceText(row.confidence);
                                    let gmapsLink = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
                                    
                                    let popupContent = `
                                    <div class="sipongi-popup">
                                        <table>
                                            <tbody>
                                                <tr><th>Tanggal</th><td>${dateStr}</td></tr>
                                                <tr><th>Sumber</th><td>${satStr}</td></tr>
                                                <tr><th>Latitude</th><td>${lat.toFixed(5)}</td></tr>
                                                <tr><th>Longitude</th><td>${lon.toFixed(5)}</td></tr>
                                                <tr><th>Kepercayaan</th><td>${confText}</td></tr>
                                                <tr><th>Resor</th><td>${matchedResort}</td></tr>
                                                <tr><th>Cek Lokasi</th><td><a href="${gmapsLink}" target="_blank" style="color:blue;">Buka di Google Maps &raquo;</a></td></tr>
                                            </tbody>
                                        </table>
                                    </div>`;

                                    L.circleMarker([lat, lon], getMarkerStyle(row.confidence))
                                     .bindPopup(popupContent, { maxWidth: 350 })
                                     .addTo(hotspotLayerGroup);
                                }
                            });
                            infoControl.update();
                        }
                    }
                });
            }
        }

        initMapData();
    </script>
</body>
</html>
