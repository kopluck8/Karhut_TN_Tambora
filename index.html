<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS Hotspot - TN Tambora</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([-8.2500, 117.9500], 11);

        var basemap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // MAP_KEY dimasukkan langsung ke dalam path URL utama
        var firmsURL = 'https://firms.modaps.eosdis.nasa.gov/mapserver/wms/fires/bcd8b7f4bc826aab3b3928e4da79f267/';

        var hotspotModis = L.tileLayer.wms(firmsURL, {
            layers: 'fires_modis_24',
            format: 'image/png',
            transparent: true,
            attribution: 'NASA FIRMS (Terra/Aqua)'
        });

        var hotspotSNPP = L.tileLayer.wms(firmsURL, {
            layers: 'fires_viirs_snpp_24',
            format: 'image/png',
            transparent: true,
            attribution: 'NASA FIRMS (SNPP)'
        });

        var hotspotNOAA20 = L.tileLayer.wms(firmsURL, {
            layers: 'fires_viirs_noaa20_24',
            format: 'image/png',
            transparent: true,
            attribution: 'NASA FIRMS (NOAA20)'
        });

        var overlayMaps = {
            "Hotspot TERRA/AQUA (24 Jam)": hotspotModis,
            "Hotspot SNPP (24 Jam)": hotspotSNPP,
            "Hotspot NOAA20 (24 Jam)": hotspotNOAA20
        };

        L.control.layers({"Basemap Imagery": basemap}, overlayMaps).addTo(map);
        hotspotModis.addTo(map);
        hotspotSNPP.addTo(map);
        hotspotNOAA20.addTo(map);
    </script>
</body>
</html>
